<!DOCTYPE html>
<html>

<head>
  <title>Käyttäjä: {{ user.username}}</title>
</head>

<body>
    <h1>Käyttäjä: {{ user.username}}</h1>
    <p>
      Käyttäjällä on yhteensä {{ games | count }} peliä.
    </p>
    <h2>Pelit:</h2>
    <ul>
        {% for game in games %}
        <li><a href="/game/{{ game.id }}">{{ game.content }}</a></li>
        {% endfor %}
    </ul>
    <p>
    <a href="/">Palaa takaisin</a>
    </p>
</body>

</html>
