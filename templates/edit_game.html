<!DOCTYPE html>
<html>

<head>
  <title>Pelin muokkaus</title>
</head>

<body>
  <h1>Pelin muokkaus</h1>
  <form action="/update_game" method="post">
    <p>
      Pelin tiedot: <br />
      <textarea name="description" rows="3" cols="40" maxlength="100" required>{{ game.description }}</textarea>
    </p>
    <p>
      Alusta: <br />
      <input type="text" name="platform" maxlength="20" size ="20" value="{{ game.platform }}"/>
    </p>
    <p>
      Kunto: <br />
      <input type="text" name="condition" maxlength="20" size ="20" value="{{ game.condition }}"/>
    </p>
    <p>
      <input type="hidden" name="game_id" value="{{ game.id }}" />
      <input type="submit" value="Päivitä pelin tiedot" />
    </p>
  </form>
  <p>
    <a href="/">Palaa takaisin</a>
  </p>
</body>

</html>
